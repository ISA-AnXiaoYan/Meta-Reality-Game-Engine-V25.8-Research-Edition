[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-reality-game-engine-research"
version = "0.2.0.dev0"
description = "Meta-Reality Game Engine public research foundation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "ISA-AnXiaoYan" }]
dependencies = []

[project.scripts]
mrge = "mrge.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
